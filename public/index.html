<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101114"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/styles.css?v=034"><title>RetroPad</title></head><body>
<div id="join" class="overlay"><div class="card"><h1>RetroPad</h1><p>Enter the six-character code or scan the QR code shown by the receiver.</p><div class="joinrow"><input id="room" maxlength="6" placeholder="ABC123" autocomplete="off"><button id="joinBtn" class="primary">Connect</button></div><p class="note">The controller and game system should be on the same local network.</p></div></div>
<div class="topbar"><div class="brand">RETROPAD</div><select id="profile"></select><div id="playerBadge" class="player-badge">P?</div><div class="spacer"></div><div id="status" class="status">Disconnected</div><button id="fullscreen" class="pill icon-pill" aria-label="Fullscreen">⛶</button><button id="disconnect" class="pill">Pair</button></div>
<div id="shoulders" class="shoulders"><div id="leftShoulders"></div><div id="rightShoulders"></div></div>
<main class="pad"><section class="zone"><div id="leftControl"><div class="dpad"><button class="up" data-btn="UP">▲</button><button class="down" data-btn="DOWN">▼</button><button class="left" data-btn="LEFT">◀</button><button class="right" data-btn="RIGHT">▶</button></div></div></section><section class="center"><div id="centerBtns" class="center-buttons"></div></section><section class="zone"><div id="face" class="face"></div></section></main>
<div id="rightStickWrap" class="stick-wrap hidden"><div class="stick-label">R</div><div id="rightStick" class="stick"><div class="nub"></div></div></div>
<script src="/app.js?v=034"></script></body></html>
