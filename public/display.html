<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RetroPad Display</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#090a0d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0d}.stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1b1e28,#090a0d 70%)}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.overlay{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:28px}.brand{font-weight:900;letter-spacing:.18em;font-size:15px}.headline{font-size:clamp(28px,5vw,54px);font-weight:850;margin:0}.qr{width:min(40vh,320px);aspect-ratio:1;background:#fff;border-radius:18px;padding:12px}.code{font:900 clamp(30px,6vw,56px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em}.status{color:#aeb4c0;font-size:16px}.hidden{display:none!important}.toolbar{position:fixed;z-index:4;right:18px;bottom:18px;display:flex;gap:8px}.toolbar button{border:1px solid #3b404b;background:#181b21;color:#fff;border-radius:12px;padding:10px 14px;font-weight:700}.connected .overlay{opacity:0;pointer-events:none;transition:opacity .25s}.connected:hover .overlay{opacity:1}.connected .overlay>*{display:none}.connected .overlay .status{display:block;background:#000a;padding:8px 12px;border-radius:999px}
  </style>
</head>
<body>
<div class="stage" id="stage">
  <video id="game" autoplay playsinline></video>
  <div class="overlay" id="overlay">
    <div class="brand">RETROPAD DISPLAY</div>
    <h1 class="headline">Scan to play</h1>
    <img class="qr" id="qr" alt="RetroPad pairing QR">
    <div class="code" id="code">------</div>
    <div class="status" id="status">Creating room…</div>
  </div>
  <div class="toolbar">
    <button id="newRoom">New QR</button>
    <button id="fullscreen">Fullscreen</button>
  </div>
</div>
<script src="/display.js"></script>
</body>
</html>
